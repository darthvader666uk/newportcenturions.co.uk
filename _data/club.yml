# =============================================================================
# Newport Centurions Korfball Club — single source of truth for club facts.
#
# Training times, venue, dates and fees were previously hardcoded across 19
# files (including the JSON-LD includes, where a missed edit goes unnoticed).
# Change a fact HERE and it updates everywhere that reads site.data.club.
#
# NOTE: `season.beginner_sessions` is filtered to upcoming dates at BUILD time,
# so a passed date only disappears on the next push/rebuild.
# =============================================================================

name: Newport Centurions Korfball Club
short_name: Newport Centurions
# Club badge, used on fixture cards. Opponent crests go in
# assets/images/teams/<slug>.webp|png|svg and are picked up automatically.
crest: /images/newport-centurions-korfball-club-400.webp
crest_slug: newport
# Clubs the calendar writes more than one way. The key is the slug as written
# (lowercased, hyphenated, squad number stripped); the value is the crest file
# to use. Saves keeping two copies of the same badge.
crest_aliases:
  raptors: cardiff-raptors
founded: 2019
email: Newportkorfball@gmail.com

# --- Membership -------------------------------------------------------------
members: "30+"
teams: 3
min_age: 16
free_sessions: 2
free_sessions_text: "First 2 sessions free"

# --- Venue ------------------------------------------------------------------
venue:
  name: The John Frost School
  street: Duffryn
  locality: Newport
  region: Wales
  postcode: NP10 8YD
  country: GB
  latitude: "51.5584"
  longitude: "-3.0104"
  maps_url: https://maps.app.goo.gl/csVguoRKVX1dXAYYA
  short: "John Frost School, Duffryn, NP10 8YD"

# --- Training ---------------------------------------------------------------
# `schema_day` values must be schema.org DayOfWeek names.
training:
  - day: Tuesday
    schema_day: Tuesday
    start: "18:00"
    end: "20:00"
    display: "6:00 PM to 8:00 PM"
    display_short: "6–8pm"
  - day: Thursday
    schema_day: Thursday
    start: "20:00"
    end: "21:00"
    display: "8:00 PM to 9:00 PM"
    display_short: "8–9pm"

# --- Season -----------------------------------------------------------------
# Only the season label and start date live here now. Event dates come from the
# club's Google Calendar via _data/fixtures.yml, so there is one list, not two.
# To advertise a beginner session, tag it [Beginners] in Google Calendar.
season:
  label: "2026/27"
  start_date: 2026-08-18
  # The playing season, as month numbers. /events/ shows every month between
  # these two, empty ones included, so the pager walks the whole season rather
  # than skipping the quiet months. 9 to 5 wraps the year end: September to May.
  first_month: 9
  last_month: 5

# --- Competition ------------------------------------------------------------
leagues:
  - Welsh Korfball League
  - Western Regional League

# League codes as they are written at the front of a calendar event title,
# e.g. "WKL: Newport 2 V Cardiff City 2". The sync strips the code from the
# displayed title and shows the league on the fixture instead. Add a code here
# and it is recognised; anything not listed is left in the title untouched, so
# a typo shows up rather than being silently swallowed.
league_codes:
  WKL: Welsh Korfball League
  WRL: Western Regional League

awards:
  - "Welsh League Champions 2022/2023"
  - "Welsh League Champions 2025"
awards_short: "Welsh League Champions 2022/23 & 2025"
titles_count: 3

# --- Links ------------------------------------------------------------------
store_url: https://rcs-teamwear.com/newport-centurions-korfball/

social:
  - name: Facebook
    url: https://facebook.com/newportcenturions
    icon: fa-facebook
  - name: Twitter
    url: https://twitter.com/newportkorfball
    icon: fa-twitter
  - name: Instagram
    url: https://instagram.com/newportkorfball
    icon: fa-instagram
  - name: YouTube
    url: https://youtube.com/@newportcenturionskorfball5878
    icon: fa-youtube
