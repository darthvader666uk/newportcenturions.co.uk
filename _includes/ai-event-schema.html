{%- comment -%}
  Recurring training-session Event schema.
  All facts come from _data/club.yml — do not hardcode them here.
{%- endcomment -%}
{%- assign club = site.data.club -%}
<!-- Event Schema for Training Sessions -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Event",
  "name": "{{ club.short_name }} Korfball Training",
  "description": "Regular korfball training sessions open to all abilities. Beginners welcome. {{ club.free_sessions_text }}.",
  "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
  "eventStatus": "https://schema.org/ScheduledEvent",
  "location": {
    "@type": "Place",
    "name": {{ club.venue.name | jsonify }},
    "address": {
      "@type": "PostalAddress",
      "streetAddress": {{ club.venue.street | jsonify }},
      "addressLocality": {{ club.venue.locality | jsonify }},
      "postalCode": {{ club.venue.postcode | jsonify }},
      "addressCountry": {{ club.venue.country | jsonify }}
    }
  },
  "organizer": {
    "@type": "SportsOrganization",
    "name": {{ club.name | jsonify }},
    "url": "{{ site.url }}"
  },
  "performer": {
    "@type": "SportsOrganization",
    "name": {{ club.name | jsonify }}
  },
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "GBP",
    "description": {{ club.free_sessions_text | jsonify }}
  },
  "superEvent": {
    "@type": "Schedule",
    "repeatFrequency": "https://schema.org/Weekly",
    "byDay": [{% for session in club.training %}"https://schema.org/{{ session.schema_day }}"{% unless forloop.last %}, {% endunless %}{% endfor %}],
    "startTime": "{{ club.training[0].start }}",
    "endTime": "{{ club.training[0].end }}",
    "timeZone": "Europe/London"
  }
}
</script>
