{%- comment -%}
  LocalBusiness / SportsActivityLocation schema for local SEO.
  All facts come from _data/club.yml — do not hardcode them here.
{%- endcomment -%}
{%- assign club = site.data.club -%}
<!-- LocalBusiness Schema for Local SEO -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SportsActivityLocation",
  "name": {{ club.name | jsonify }},
  "image": "{{ site.url }}/images/newport-centurions-korfball-club.webp",
  "url": "{{ site.url }}",
  "email": {{ club.email | jsonify }},
  "address": {
    "@type": "PostalAddress",
    "streetAddress": {{ club.venue.street | jsonify }},
    "addressLocality": {{ club.venue.locality | jsonify }},
    "addressRegion": {{ club.venue.region | jsonify }},
    "postalCode": {{ club.venue.postcode | jsonify }},
    "addressCountry": {{ club.venue.country | jsonify }}
  },
  "geo": {
    "@type": "GeoCoordinates",
    "latitude": {{ club.venue.latitude }},
    "longitude": {{ club.venue.longitude }}
  },
  "openingHoursSpecification": [
    {%- for session in club.training %}
    {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": ["https://schema.org/{{ session.schema_day }}"],
      "opens": "{{ session.start }}",
      "closes": "{{ session.end }}"
    }{% unless forloop.last %},{% endunless %}
    {%- endfor %}
  ],
  "description": "Mixed-gender korfball club. {{ club.awards_short }}. Beginners welcome, {{ club.free_sessions_text | downcase }}.",
  "sameAs": [
    {%- for link in club.social %}
    {{ link.url | jsonify }}{% unless forloop.last %},{% endunless %}
    {%- endfor %}
  ]
}
</script>
