name: Scheduled Rebuild

# Date-sensitive content (the announcement bar, llms.txt, Event schema) is
# filtered at BUILD time. Without a push, a passed date would linger in the
# served HTML until the next commit.
#
# The pages are also self-correcting client-side, so visitors never see a
# stale date — but crawlers and AI scrapers read the raw HTML, so this keeps
# that honest too.
#
# Triggers a GitHub Pages build directly: no empty commits, no history noise.

on:
  schedule:
    # 04:15 UTC daily — quiet, and well before UK morning traffic.
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request a GitHub Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/pages/builds"
